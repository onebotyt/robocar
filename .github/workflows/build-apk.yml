name: Build NovaX Android APK & ESP32 Firmware

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'apk/**'
      - 'firmware/*.bin'
      - '*.md'
      - 'docs/**'
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Auto-Bump Version Counter
        id: bump_ver
        run: |
          BUILD_CODE=${{ github.run_number }}
          BUILD_DATE=$(date +'%Y-%m-%d')
          
          # Read base version prefix from version.json (e.g. 2.3)
          BASE_PREFIX=$(node -e "const v = require('./version.json'); console.log(v.version.split('.').slice(0, 2).join('.'));")
          NEW_VER="${BASE_PREFIX}.${BUILD_CODE}"
          echo "NEW_VERSION=${NEW_VER}" >> $GITHUB_ENV
          echo "BUILD_CODE=${BUILD_CODE}" >> $GITHUB_ENV
          echo "Auto-incremented to version: $NEW_VER (Build $BUILD_CODE)"

          # Update version.json and pwa/version.json
          node -e "
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('./version.json', 'utf8'));
            v.version = '$NEW_VER';
            v.buildCode = $BUILD_CODE;
            v.buildDate = '$BUILD_DATE';
            if (v.firmware) {
              v.firmware.version = '$NEW_VER';
              v.firmware.releaseDate = '$BUILD_DATE';
            }
            fs.writeFileSync('./version.json', JSON.stringify(v, null, 2) + '\n');
            fs.writeFileSync('./pwa/version.json', JSON.stringify(v, null, 2) + '\n');

            const fv = {
              version: '$NEW_VER',
              buildDate: '$BUILD_DATE',
              target: 'ESP32-WROOM-32',
              binFile: 'NovaX-Firmware.bin',
              downloadUrl: 'https://raw.githubusercontent.com/onebotyt/robocar/main/firmware/NovaX-Firmware.bin',
              changelog: v.changelog || 'Latest NovaX build'
            };
            fs.writeFileSync('./firmware/version.json', JSON.stringify(fv, null, 2) + '\n');
          "

          # Update android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $BUILD_CODE/g" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$NEW_VER\"/g" android/app/build.gradle

          # Update CURRENT_APP_VERSION in app.js and pwa/app.js
          sed -i "s/const CURRENT_APP_VERSION = '.*';/const CURRENT_APP_VERSION = '$NEW_VER';/g" app.js pwa/app.js

          # Update BUNDLE_VERSION in index.html and pwa/index.html
          sed -i "s/var BUNDLE_VERSION = '.*';/var BUNDLE_VERSION = '$NEW_VER';/g" index.html pwa/index.html

          # Update CACHE_NAME in sw.js and pwa/sw.js
          sed -i "s/const CACHE_NAME = '.*';/const CACHE_NAME = 'novax-cache-v$NEW_VER';/g" sw.js pwa/sw.js

          # Update FIRMWARE_VERSION and BUILD_DATE in esp32/NovaX_V2.ino
          sed -i "s/const char\* FIRMWARE_VERSION  = \".*\";/const char* FIRMWARE_VERSION  = \"$NEW_VER\";/g" esp32/NovaX_V2.ino
          sed -i "s/const char\* BUILD_DATE        = \".*\";/const char* BUILD_DATE        = \"$BUILD_DATE\";/g" esp32/NovaX_V2.ino

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Sync Web Assets & Capacitor
        run: |
          cp index.html style.css app.js icon* manifest.webmanifest sw.js version.json pwa/
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect Generated APK
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" build-output/NovaX-Controller.apk

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Board and Libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.14
          arduino-cli lib install "ESP32Servo" "Adafruit MPU6050" "Adafruit BusIO" "Adafruit Unified Sensor"

      - name: Compile ESP32 Firmware Binary
        run: |
          mkdir -p firmware
          mkdir -p build-sketch/NovaX_V2
          cp -r esp32/* build-sketch/NovaX_V2/
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs --output-dir firmware/ build-sketch/NovaX_V2
          BIN_FILE=$(find firmware/ -type f -name "*NovaX_V2*.bin" ! -name "*.partitions.bin" ! -name "*.bootloader.bin" | head -n 1)
          if [ -z "$BIN_FILE" ]; then
            BIN_FILE=$(find firmware/ -type f -name "*.bin" ! -name "*.partitions.bin" ! -name "*.bootloader.bin" | head -n 1)
          fi
          if [ -n "$BIN_FILE" ]; then
            echo "Found compiled binary: $BIN_FILE"
            cp "$BIN_FILE" firmware/NovaX-Firmware.bin
            cp "$BIN_FILE" build-output/NovaX-Firmware.bin
            echo "ESP32 Firmware binary compiled successfully."
          else
            echo "::error::No binary file found after compilation!"
            exit 1
          fi

      - name: Upload Debug APK & Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaX-Release-Artifacts
          path: build-output/
          if-no-files-found: warn

      - name: Commit Built Artifacts to Repository Folder
        run: |
          mkdir -p apk
          cp build-output/NovaX-Controller.apk apk/NovaX-Controller.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apk/NovaX-Controller.apk version.json pwa/version.json firmware/version.json app.js pwa/app.js index.html pwa/index.html sw.js pwa/sw.js pwa/style.css android/app/build.gradle esp32/NovaX_V2.ino
          if [ -f "firmware/NovaX-Firmware.bin" ]; then
            git add firmware/NovaX-Firmware.bin
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(release): auto-bump version to v${NEW_VERSION}, build APK & ESP32 binary [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Create Release & Attach Artifacts (On Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-output/NovaX-Controller.apk
            build-output/NovaX-Firmware.bin
          name: NovaX Controller ${{ github.ref_name }}
          body_path: pwa/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
