name: Build NovaX Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect Generated APK
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" build-output/NovaX-Controller.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaX-Controller-APK
          path: build-output/NovaX-Controller.apk
          if-no-files-found: error

      - name: Create Release & Attach APK (On Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/NovaX-Controller.apk
          name: NovaX Controller ${{ github.ref_name }}
          body_path: pwa/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
