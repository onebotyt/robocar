<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c14" />
      <stop offset="50%" stop-color="#091824" />
      <stop offset="100%" stop-color="#04080e" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#00f2fe" stroke-width="6" stroke-opacity="0.6"/>

  <!-- High-tech grid patterns -->
  <path d="M 64 256 H 448 M 256 64 V 448 M 128 128 L 384 384 M 128 384 L 384 128" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="12 6"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#4facfe" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Outer Cyber Wings / Shield -->
  <g filter="url(#neonGlow)">
    <path d="M 120 180 Q 200 160 256 210 Q 312 160 392 180 Q 350 260 256 360 Q 162 260 120 180 Z" fill="none" stroke="url(#neonCyan)" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Stylized Futuristic Car Front Silhouette -->
    <path d="M 180 230 L 210 190 L 302 190 L 332 230 L 350 255 L 340 280 L 320 285 L 305 270 L 207 270 L 192 285 L 172 280 L 162 255 Z" fill="#0d2638" stroke="url(#neonCyan)" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Headlights -->
    <polygon points="190,240 230,240 220,252 185,250" fill="#00f2fe" opacity="0.9"/>
    <polygon points="322,240 282,240 292,252 327,250" fill="#00f2fe" opacity="0.9"/>
    
    <!-- Center Core Reactor / Inverted Triangle -->
    <polygon points="256,240 276,280 236,280" fill="#00f2fe" opacity="0.8"/>
    <circle cx="256" cy="265" r="4" fill="#ffffff"/>

    <!-- Wing Flairs -->
    <path d="M 120 210 Q 80 230 60 270 Q 110 270 145 250" fill="none" stroke="url(#neonCyan)" stroke-width="5"/>
    <path d="M 392 210 Q 432 230 452 270 Q 402 270 367 250" fill="none" stroke="url(#neonCyan)" stroke-width="5"/>
    
    <!-- Bottom Accent Chevron -->
    <path d="M 220 380 L 256 415 L 292 380" fill="none" stroke="url(#neonCyan)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
